<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="row">
		<label for="mode">Show</label>
		<select id="mode" data-setting="mode">
			<option value="attention">Slot, most urgent first</option>
			<option value="order">Slot, herdr order</option>
			<option value="pinned">A specific agent</option>
		</select>
	</div>
	<div class="row" id="slot-row"><label for="slot">Slot</label><input id="slot" type="number" min="1" data-setting="slot" /></div>
	<div class="row" id="pin-row"><label for="pin">Agent</label><select id="pin"></select></div>
	<div class="row" id="idle-row"><label for="hideIdle">Skip idle agents</label><input id="hideIdle" type="checkbox" data-setting="hideIdle" /></div>
	<div class="row"><label for="flash">Flash when blocked</label><input id="flash" type="checkbox" data-setting="flash" /></div>
	<div class="row">
		<label for="background">Background</label>
		<select id="background" data-setting="background">
			<option value="tint">Tinted by status</option>
			<option value="plain">Plain</option>
		</select>
	</div>
	<div class="row"><label for="showTitle">Show pane title</label><input id="showTitle" type="checkbox" data-setting="showTitle" /></div>
	<h4>All keys</h4>
	<div class="row"><label for="activate">After focus, run</label><input id="activate" data-global="activateCommand" placeholder="wmctrl -xa ghostty" /></div>
	<div class="hint">Optional shell command to raise your terminal window.</div>
	<div class="row"><label for="session">herdr session</label><input id="session" data-global="session" placeholder="default" /></div>
	<div class="row"><label for="socket">Socket path</label><input id="socket" data-global="socketPath" placeholder="~/.config/herdr/herdr.sock" /></div>
	<div id="status"></div>
	<script type="module" src="agent.js"></script>
</body>
</html>
