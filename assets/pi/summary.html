<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="row"><label for="flash">Flash when blocked</label><input id="flash" type="checkbox" data-setting="flash" /></div>
	<div class="hint">Press to jump to the agent that needs you (or just finished).</div>
	<h4>All keys</h4>
	<div class="row">
		<label for="raise">Bring terminal to front</label>
		<select id="raise" data-global="raise">
			<option value="auto">Yes</option>
			<option value="off">No</option>
		</select>
	</div>
	<div class="hint">Raises the terminal running herdr after a press. On X11 this needs <code>wmctrl</code>.</div>
	<div class="row"><label for="activate">Custom raise command</label><input id="activate" data-global="activateCommand" placeholder="automatic" /></div>
	<div class="hint">Optional shell command that replaces the automatic raise, e.g. for Wayland.</div>
	<div class="row"><label for="session">herdr session</label><input id="session" data-global="session" placeholder="default" /></div>
	<div class="row"><label for="socket">Socket path</label><input id="socket" data-global="socketPath" placeholder="~/.config/herdr/herdr.sock" /></div>
	<div id="status"></div>
	<script type="module" src="summary.js"></script>
</body>
</html>
