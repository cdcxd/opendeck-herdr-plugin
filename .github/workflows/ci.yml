name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/io.github.cdcxd.herdr.streamDeckPlugin
      # OpenDeck compares the latest release tag with the installed manifest version
      # to offer updates, so a release whose manifest disagrees would never stop offering one.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(jq -r .Version assets/manifest.json)
          package=$(jq -r .version package.json)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ] || [ "v$package" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but manifest.json has $manifest and package.json has $package"
            exit 1
          fi
      # OpenDeck's plugin manager installs .streamDeckPlugin assets from GitHub releases.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/io.github.cdcxd.herdr.streamDeckPlugin --generate-notes
